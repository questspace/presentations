<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuestSpace – Prezentácie</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background: #000a16;
      color: #fff;
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 {
      font-size: 2em;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .grad {
      background: linear-gradient(90deg, #b22a72 0%, #3756e3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { opacity: 0.5; font-size: 0.85em; margin-bottom: 40px; }
    .card {
      display: block;
      background: #021226;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px;
      padding: 24px 28px;
      text-decoration: none;
      color: #fff;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: rgba(178,42,114,0.5); }
    .card h2 { font-size: 1.1em; margin: 0 0 6px; }
    .card p { font-size: 0.75em; margin: 0; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>QuestSpace <span class="grad">Prezentácie</span></h1>
    <p class="subtitle">questspace.sk</p>

    <a class="card" href="namakany-den-2026/">
      <h2>QuestSpace – Namakaný deň 2026</h2>
      <p>4. mája 2026 · Dávid Jopek · Čo je QuestSpace, čo môžeš robiť, ceny členstva, XR &amp; AI vízia</p>
    </a>
  </div>
</body>
</html>
